        fill="#ffffff" opacity="1">z</text>

  <!-- z — middle (fading) -->
  <text x="44" y="46" font-family="sans-serif" font-size="42" font-weight="bold"
        fill="#ffffff" opacity="0.55">z</text>

  <!-- z — top (most faded) -->
