<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      width: 240px;
      background: #1e1e2e;
      color: #e0e0e0;
    }

    .stats {
      color: #a0a0c0;
      font-size: 10px;
      font-weight: 500;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #888;
      border-bottom: 1px solid #333;
    }

    button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      border: none;
      background: transparent;
      color: #e0e0e0;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }

    button:hover {
      background: #2a2a3e;
    }

    button:active {
      background: #33334a;
    }

    .icon {
      flex-shrink: 0;
    }

    .label {
      flex: 1;
    }

    .count {
      background: #33334a;
      color: #a0a0c0;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
    }

    .divider {
      height: 1px;
      background: #333;
      margin: 4px 0;
    }
  </style>
</head>

<body>
  <div class="header">
    Unload Tabs
    <span class="stats" id="stats">Tabs: 0 · Pinned: 0</span>
  </div>

  <button id="unloadAll">
    <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" />
      <line x1="3" y1="9" x2="21" y2="9" />
    </svg>
    <span class="label">Unload all tabs</span>
    <span class="count" id="countAll">0</span>
  </button>

  <div class="divider"></div>

  <button id="unloadUnpinned">
    <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 17v5" />
      <path
        d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z" />
    </svg>
    <span class="label">Keep pinned loaded</span>
    <span class="count" id="countUnpinned">0</span>
  </button>

  <script src="popup.js"></script>
</body>

</html>
